<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jyotish Darshan — Daily Rashifal & Kundli Milan</title>

  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Jyotish Darshan" />
  <meta name="description" content="Vedic Daily Rashifal and 36-point Guna Kundli Milan app in English & Hindi." />

  <!-- Google Analytics (GA4) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Q7L50HM8VP"></script>
  <script>
    const GA_MEASUREMENT_ID = 'G-Q7L50HM8VP';
    window.dataLayer = window.dataLayer || [];
    function gtag() {
      window.dataLayer.push(arguments);
    }
    gtag('js', new Date());
    gtag('config', GA_MEASUREMENT_ID);

    function trackEvent(eventName, params = {}) {
      try {
        if (typeof gtag === 'function') {
          gtag('event', eventName, params);
        }
      } catch (e) {
        // Ignore analytics errors
      }
    }
  </script>

  <style>
    :root {
      --bg: #0b1120;
      --card: #131c31;
      --card-2: #1a2642;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #f59e0b;
      --accent-2: #fbbf24;
      --border: rgba(255, 255, 255, 0.1);
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      line-height: 1.5;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .brand h1 {
      font-size: 1.35rem;
      color: var(--accent-2);
    }

    .brand p {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .header-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button, select, input {
      font-family: inherit;
      font-size: 0.95rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 10px 14px;
      color: var(--text);
      background: var(--card-2);
    }

    button {
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.12s ease, background 0.15s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #d97706);
      color: #090d16;
      border: none;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent-2);
    }

    .mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .mode-tab {
      padding: 12px;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-weight: 700;
    }

    .mode-tab.active {
      background: var(--accent);
      color: #090d16;
      border-color: var(--accent);
    }

    .panel {
      display: none;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .panel.active {
      display: block;
    }

    .rashi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
      gap: 8px;
      margin: 14px 0;
    }

    .rashi-btn {
      padding: 9px 8px;
      font-size: 0.85rem;
      background: var(--card-2);
      border: 1px solid var(--border);
    }

    .rashi-btn.selected {
      background: rgba(245, 158, 11, 0.22);
      border-color: var(--accent-2);
      color: var(--accent-2);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin: 12px 0;
    }

    .field label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .field input, .field select {
      width: 100%;
    }

    .result-box {
      margin-top: 16px;
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }

    .date-badge {
      display: inline-block;
      font-size: 0.82rem;
      color: var(--accent-2);
      background: rgba(245, 158, 11, 0.14);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .score-big {
      font-size: 2rem;
      font-weight: 800;
      color: var(--success);
      margin: 6px 0;
    }

    .actions-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .status-note {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <h1 id="appTitle">Jyotish Darshan</h1>
        <p id="appSubtitle">Daily Rashifal &amp; 36-Guna Kundli Milan</p>
      </div>
      <div class="header-actions">
        <button type="button" id="langToggleBtn" class="btn-outline">हिन्दी</button>
        <button type="button" id="installAppBtn" class="btn-outline" style="display: none;">Install App</button>
      </div>
    </header>

    <div class="mode-tabs">
      <button type="button" id="tabRashifal" class="mode-tab active">Daily Rashifal</button>
      <button type="button" id="tabKundli" class="mode-tab">Kundli Milan</button>
    </div>

    <!-- RASHIFAL PANEL -->
    <section id="panelRashifal" class="panel active">
      <span id="todayDateBadge" class="date-badge"></span>

      <div class="field">
        <label id="lblSelectRashi" for="rashiSelect">Select Your Rashi (Zodiac Sign)</label>
        <select id="rashiSelect"></select>
      </div>

      <div id="rashiGrid" class="rashi-grid"></div>

      <div class="actions-row">
        <button type="button" id="calcRashifalBtn" class="btn-primary">Get Daily Rashifal</button>
      </div>

      <div id="rashifalResult" class="result-box"></div>
    </section>

    <!-- KUNDLI MILAN PANEL -->
    <section id="panelKundli" class="panel">
      <h2 id="kundliHeading" style="font-size: 1.1rem; margin-bottom: 10px; color: var(--accent-2);">36-Guna Kundli Milan</h2>

      <div class="grid-2">
        <div class="field">
          <label id="lblPartner1Name" for="partner1Name">First Person Name</label>
          <input type="text" id="partner1Name" placeholder="e.g. Aarav" />
        </div>
        <div class="field">
          <label id="lblPartner1Rashi" for="partner1Rashi">First Person Rashi</label>
          <select id="partner1Rashi"></select>
        </div>
        <div class="field">
          <label id="lblPartner2Name" for="partner2Name">Second Person Name</label>
          <input type="text" id="partner2Name" placeholder="e.g. Ananya" />
        </div>
        <div class="field">
          <label id="lblPartner2Rashi" for="partner2Rashi">Second Person Rashi</label>
          <select id="partner2Rashi"></select>
        </div>
      </div>

      <div class="actions-row">
        <button type="button" id="calcKundliBtn" class="btn-primary">Check Kundli Milan</button>
      </div>

      <div id="kundliResult" class="result-box"></div>
    </section>

    <p id="footerNote" class="status-note">Local device date &amp; browser storage active. Analytics enabled.</p>
  </div>

  <script>
    (function () {
      const RASHIS = [
        { key: 'aries', en: 'Mesh (Aries)', hi: 'मेष' },
        { key: 'taurus', en: 'Vrishabh (Taurus)', hi: 'वृषभ' },
        { key: 'gemini', en: 'Mithun (Gemini)', hi: 'मिथुन' },
        { key: 'cancer', en: 'Kark (Cancer)', hi: 'कर्क' },
        { key: 'leo', en: 'Singh (Leo)', hi: 'सिंह' },
        { key: 'virgo', en: 'Kanya (Virgo)', hi: 'कन्या' },
        { key: 'libra', en: 'Tula (Libra)', hi: 'तुला' },
        { key: 'scorpio', en: 'Vrishchik (Scorpio)', hi: 'वृश्चिक' },
        { key: 'sagittarius', en: 'Dhanu (Sagittarius)', hi: 'धनु' },
        { key: 'capricorn', en: 'Makar (Capricorn)', hi: 'मकर' },
        { key: 'aquarius', en: 'Kumbh (Aquarius)', hi: 'कुंभ' },
        { key: 'pisces', en: 'Meen (Pisces)', hi: 'मीन' }
      ];

      const MESSAGES_EN = [
        'Steady progress in work and clear communication brings positive outcomes today.',
        'Focus on priorities, keep calm in discussions, and avoid rushed decisions.',
        'Good day for planning, family harmony, and completing pending tasks.',
        'Helpful support arrives when needed; stay practical with expenses and commitments.'
      ];

      const MESSAGES_HI = [
        'कार्यक्षेत्र में स्थिर प्रगति और स्पष्ट बातचीत से आज सकारात्मक परिणाम मिलेंगे।',
        'प्राथमिकताओं पर ध्यान दें, चर्चा में शांत रहें और जल्दबाजी में निर्णय न लें।',
        'योजना बनाने, पारिवारिक तालमेल और रुके हुए काम पूरे करने के लिए अच्छा दिन है।',
        'ज़रूरत के समय सहयोग मिलेगा; खर्च और वादों को लेकर व्यावहारिक रहें।'
      ];

      let currentLang = localStorage.getItem('jd_lang') || 'en';
      let selectedRashiIndex = Number(localStorage.getItem('jd_rashi_idx') || 0);
      if (Number.isNaN(selectedRashiIndex) || selectedRashiIndex < 0 || selectedRashiIndex >= RASHIS.length) {
        selectedRashiIndex = 0;
      }

      function getLocalDateKey() {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      }

      function getFormattedToday() {
        const now = new Date();
        const locale = currentLang === 'hi' ? 'hi-IN' : 'en-IN';
        return now.toLocaleDateString(locale, {
          weekday: 'long',
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        });
      }

      function getRashiLabel(index) {
        const item = RASHIS[index] || RASHIS[0];
        return currentLang === 'hi' ? `${item.hi} (${item.en.split(' ')[0]})` : item.en;
      }

      function populateSelects() {
        const rashiSelect = document.getElementById('rashiSelect');
        const p1Select = document.getElementById('partner1Rashi');
        const p2Select = document.getElementById('partner2Rashi');

        const prevP1 = p1Select.value || '0';
        const prevP2 = p2Select.value || '6';

        [rashiSelect, p1Select, p2Select].forEach((sel) => {
          sel.innerHTML = '';
          RASHIS.forEach((r, idx) => {
            const opt = document.createElement('option');
            opt.value = String(idx);
            opt.textContent = getRashiLabel(idx);
            sel.appendChild(opt);
          });
        });

        rashiSelect.value = String(selectedRashiIndex);
        p1Select.value = prevP1;
        p2Select.value = prevP2;
      }

      function renderRashiGrid() {
        const grid = document.getElementById('rashiGrid');
        grid.innerHTML = '';
        RASHIS.forEach((r, idx) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'rashi-btn' + (idx === selectedRashiIndex ? ' selected' : '');
          btn.textContent = currentLang === 'hi' ? r.hi : r.en.split(' ')[0];
          btn.addEventListener('click', () => {
            selectedRashiIndex = idx;
            localStorage.setItem('jd_rashi_idx', String(idx));
            document.getElementById('rashiSelect').value = String(idx);
            renderRashiGrid();
            renderRashifal();
            trackEvent('rashi_switched', { rashi: r.key, lang: currentLang });
          });
          grid.appendChild(btn);
        });
      }

      function renderRashifal() {
        const dateStr = getFormattedToday();
        const dateKey = getLocalDateKey();
        document.getElementById('todayDateBadge').textContent =
          (currentLang === 'hi' ? 'आज की तारीख: ' : 'Today: ') + dateStr;

        const seed = dateKey.split('-').reduce((acc, n) => acc + Number(n), 0) + selectedRashiIndex * 7;
        const msg = currentLang === 'hi'
          ? MESSAGES_HI[seed % MESSAGES_HI.length]
          : MESSAGES_EN[seed % MESSAGES_EN.length];

        const luckyNum = ((seed * 3) % 9) + 1;
        const rashiName = getRashiLabel(selectedRashiIndex);

        const box = document.getElementById('rashifalResult');
        if (currentLang === 'hi') {
          box.innerHTML = `
            <h3>${rashiName} — दैनिक राशिफल</h3>
            <p style="margin-top: 8px;">${msg}</p>
            <p class="status-note"><strong>शुभ अंक:</strong> ${luckyNum} | <strong>दिनांक:</strong> ${dateStr}</p>
          `;
        } else {
          box.innerHTML = `
            <h3>${rashiName} — Daily Rashifal</h3>
            <p style="margin-top: 8px;">${msg}</p>
            <p class="status-note"><strong>Lucky Number:</strong> ${luckyNum} | <strong>Date:</strong> ${dateStr}</p>
          `;
        }
      }

      function renderKundliMilan() {
        const p1Name = document.getElementById('partner1Name').value.trim() || (currentLang === 'hi' ? 'पहला व्यक्ति' : 'Person 1');
        const p2Name = document.getElementById('partner2Name').value.trim() || (currentLang === 'hi' ? 'दूसरा व्यक्ति' : 'Person 2');
        const idx1 = Number(document.getElementById('partner1Rashi').value || 0);
        const idx2 = Number(document.getElementById('partner2Rashi').value || 0);

        const diff = Math.abs(idx1 - idx2);
        const rawScore = 18 + ((diff * 5 + idx1 + idx2) % 18);
        const gunaScore = Math.min(36, Math.max(18, rawScore));

        const r1 = getRashiLabel(idx1);
        const r2 = getRashiLabel(idx2);
        const box = document.getElementById('kundliResult');

        if (currentLang === 'hi') {
          const verdict = gunaScore >= 25 ? 'उत्तम तालमेल' : gunaScore >= 20 ? 'संतुलित तालमेल' : 'संवाद और समझ आवश्यक';
          box.innerHTML = `
            <div><strong>${p1Name}</strong> (${r1}) × <strong>${p2Name}</strong> (${r2})</div>
            <div class="score-big">${gunaScore} / 36 गुण</div>
            <p>${verdict}</p>
          `;
        } else {
          const verdict = gunaScore >= 25 ? 'Strong Compatibility' : gunaScore >= 20 ? 'Balanced Match' : 'Mutual Understanding Recommended';
          box.innerHTML = `
            <div><strong>${p1Name}</strong> (${r1}) × <strong>${p2Name}</strong> (${r2})</div>
            <div class="score-big">${gunaScore} / 36 Gunas</div>
            <p>${verdict}</p>
          `;
        }
      }

      function applyLanguageUI() {
        const isHi = currentLang === 'hi';
        document.documentElement.lang = isHi ? 'hi' : 'en';
        document.getElementById('appTitle').textContent = isHi ? 'ज्योतिष दर्शन' : 'Jyotish Darshan';
        document.getElementById('appSubtitle').textContent = isHi
          ? 'दैनिक राशिफल और 36-गुण कुंडली मिलान'
          : 'Daily Rashifal & 36-Guna Kundli Milan';
        document.getElementById('langToggleBtn').textContent = isHi ? 'English' : 'हिन्दी';
        document.getElementById('tabRashifal').textContent = isHi ? 'दैनिक राशिफल' : 'Daily Rashifal';
        document.getElementById('tabKundli').textContent = isHi ? 'कुंडली मिलान' : 'Kundli Milan';
        document.getElementById('lblSelectRashi').textContent = isHi ? 'अपनी राशि चुनें' : 'Select Your Rashi (Zodiac Sign)';
        document.getElementById('calcRashifalBtn').textContent = isHi ? 'दैनिक राशिफल देखें' : 'Get Daily Rashifal';
        document.getElementById('kundliHeading').textContent = isHi ? '36-गुण कुंडली मिलान' : '36-Guna Kundli Milan';
        document.getElementById('lblPartner1Name').textContent = isHi ? 'पहले व्यक्ति का नाम' : 'First Person Name';
        document.getElementById('lblPartner1Rashi').textContent = isHi ? 'पहले व्यक्ति की राशि' : 'First Person Rashi';
        document.getElementById('lblPartner2Name').textContent = isHi ? 'दूसरे व्यक्ति का नाम' : 'Second Person Name';
        document.getElementById('lblPartner2Rashi').textContent = isHi ? 'दूसरे व्यक्ति की राशि' : 'Second Person Rashi';
        document.getElementById('calcKundliBtn').textContent = isHi ? 'कुंडली मिलान देखें' : 'Check Kundli Milan';
        document.getElementById('footerNote').textContent = isHi
          ? 'डिवाइस की वर्तमान तारीख और ब्राउज़र स्टोरेज सक्रिय है।'
          : 'Local device date & browser storage active. Analytics enabled.';

        populateSelects();
        renderRashiGrid();
        renderRashifal();
        renderKundliMilan();
      }

      document.addEventListener('DOMContentLoaded', () => {
        const tabRashifal = document.getElementById('tabRashifal');
        const tabKundli = document.getElementById('tabKundli');
        const panelRashifal = document.getElementById('panelRashifal');
        const panelKundli = document.getElementById('panelKundli');

        tabRashifal.addEventListener('click', () => {
          tabRashifal.classList.add('active');
          tabKundli.classList.remove('active');
          panelRashifal.classList.add('active');
          panelKundli.classList.remove('active');
        });

        tabKundli.addEventListener('click', () => {
          tabKundli.classList.add('active');
          tabRashifal.classList.remove('active');
          panelKundli.classList.add('active');
          panelRashifal.classList.remove('active');
        });

        document.getElementById('langToggleBtn').addEventListener('click', () => {
          currentLang = currentLang === 'en' ? 'hi' : 'en';
          localStorage.setItem('jd_lang', currentLang);
          applyLanguageUI();
          trackEvent('language_toggled', { lang: currentLang });
        });

        document.getElementById('rashiSelect').addEventListener('change', (e) => {
          selectedRashiIndex = Number(e.target.value || 0);
          localStorage.setItem('jd_rashi_idx', String(selectedRashiIndex));
          renderRashiGrid();
          renderRashifal();
          trackEvent('rashi_switched', { rashi: RASHIS[selectedRashiIndex]?.key, lang: currentLang });
        });

        document.getElementById('calcRashifalBtn').addEventListener('click', () => {
          renderRashifal();
          trackEvent('rashifal_calculated', { rashi: RASHIS[selectedRashiIndex]?.key, lang: currentLang });
        });

        document.getElementById('calcKundliBtn').addEventListener('click', () => {
          renderKundliMilan();
          trackEvent('kundli_milan_checked', { lang: currentLang });
        });

        let deferredPrompt = null;
        const installBtn = document.getElementById('installAppBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          deferredPrompt = e;
          installBtn.style.display = 'inline-block';
        });

        installBtn.addEventListener('click', async () => {
          if (!deferredPrompt) return;
          deferredPrompt.prompt();
          await deferredPrompt.userChoice;
          deferredPrompt = null;
          installBtn.style.display = 'none';
          trackEvent('pwa_installed', { lang: currentLang });
        });

        applyLanguageUI();
      });
    })();
  </script>
</body>
</html>
